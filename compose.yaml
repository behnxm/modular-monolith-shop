services:
  postgres:
    image: postgres:17.4-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_superadmin_password}
      SHOP_MIGRATOR_PASSWORD: ${SHOP_MIGRATOR_PASSWORD:-migrator_secure_password_2026}
      CATALOG_APP_PASSWORD: ${CATALOG_APP_PASSWORD:-catalog_secure_password_2026}
      INVENTORY_APP_PASSWORD: ${INVENTORY_APP_PASSWORD:-inventory_secure_password_2026}
      ORDERING_APP_PASSWORD: ${ORDERING_APP_PASSWORD:-ordering_secure_password_2026}
      PAYMENTS_APP_PASSWORD: ${PAYMENTS_APP_PASSWORD:-payments_secure_password_2026}
      NOTIFICATIONS_APP_PASSWORD: ${NOTIFICATIONS_APP_PASSWORD:-notifications_secure_password_2026}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shop}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-migrate
    command: ["--migrate"]
    environment:
      ConnectionStrings__Migrator: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=shop_migrator;Password=${SHOP_MIGRATOR_PASSWORD:-migrator_secure_password_2026}
      Database__UseMigratorConnection: "true"
      ASPNETCORE_ENVIRONMENT: Demonstration
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  host:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-host
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Demonstration
      ASPNETCORE_URLS: http://+:8080
      Database__UseMigratorConnection: "false"
      DevIssuer__Enabled: "true"
      DevIssuer__SigningKeyPath: /app/secrets/dev-issuer.key
      Authentication__Authority: https://auth.shop.local
      Authentication__Audience: shop-api
      ConnectionStrings__catalog: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=catalog_app;Password=${CATALOG_APP_PASSWORD:-catalog_secure_password_2026}
      ConnectionStrings__inventory: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=inventory_app;Password=${INVENTORY_APP_PASSWORD:-inventory_secure_password_2026}
      ConnectionStrings__ordering: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=ordering_app;Password=${ORDERING_APP_PASSWORD:-ordering_secure_password_2026}
      ConnectionStrings__payments: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=payments_app;Password=${PAYMENTS_APP_PASSWORD:-payments_secure_password_2026}
      ConnectionStrings__notifications: Host=postgres;Port=5432;Database=${POSTGRES_DB:-shop};Username=notifications_app;Password=${NOTIFICATIONS_APP_PASSWORD:-notifications_secure_password_2026}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "/app/Shop.Host.dll", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal
      - public
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/secrets
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: shop-aspire-dashboard
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "18888:18888"
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  internal:
    internal: true
  public:

volumes:
  postgres-data:
